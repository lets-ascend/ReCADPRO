<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reMarkable Drafting Pro</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar -->
        <header class="toolbar">
            <div class="toolbar-section">
                <button class="toolbar-btn" id="file-menu-btn" title="File">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                </button>
                <button class="toolbar-btn" id="undo-btn" title="Undo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 7v6h6"></path>
                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                    </svg>
                </button>
                <button class="toolbar-btn" id="redo-btn" title="Redo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 7v6h-6"></path>
                        <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
                    </svg>
                </button>
            </div>
            
            <div class="toolbar-section">
                <div class="toolbar-group">
                    <label class="toolbar-label">Tool:</label>
                    <select id="tool-select" class="toolbar-select">
                        <option value="pen">Pen</option>
                        <option value="pencil">Pencil</option>
                        <option value="brush">Brush</option>
                        <option value="eraser">Eraser</option>
                        <option value="line">Line</option>
                        <option value="rectangle">Rectangle</option>
                        <option value="circle">Circle</option>
                        <option value="arrow">Arrow</option>
                        <option value="text">Text</option>
                        <option value="ruler">Ruler</option>
                        <option value="protractor">Protractor</option>
                    </select>
                </div>
                
                <div class="toolbar-group">
                    <label class="toolbar-label">Size:</label>
                    <input type="range" id="size-slider" min="1" max="50" value="3" class="toolbar-slider">
                    <span id="size-value" class="toolbar-value">3px</span>
                </div>
                
                <div class="toolbar-group">
                    <label class="toolbar-label">Color:</label>
                    <input type="color" id="color-picker" value="#000000" class="toolbar-color">
                </div>
            </div>
            
            <div class="toolbar-section">
                <button class="toolbar-btn" id="grid-toggle" title="Toggle Grid">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
                <button class="toolbar-btn" id="snap-toggle" title="Snap to Grid">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="2" x2="12" y2="6"></line>
                        <line x1="12" y1="18" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="6" y2="12"></line>
                        <line x1="18" y1="12" x2="22" y2="12"></line>
                    </svg>
                </button>
                <button class="toolbar-btn" id="layers-btn" title="Layers">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Sidebar - Tools & Properties -->
            <aside class="sidebar left-sidebar" id="left-sidebar">
                <div class="sidebar-section">
                    <h3 class="sidebar-title">Drawing Tools</h3>
                    <div class="tool-palette">
                        <button class="tool-btn active" data-tool="pen" title="Pen">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                                <path d="M2 2l7.586 7.586"></path>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="pencil" title="Pencil">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="brush" title="Brush">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M9.06 2.573c1.487-.785 3.217-.802 4.72-.07a6.5 6.5 0 0 1 3.79 4.49c.577 1.8.95 3.642.95 5.557 0 2.632-1.023 5.169-2.84 7.067a9.96 9.96 0 0 1-5.35 2.83 1 1 0 0 1-1.131-.849l-.074-.495c-.297-1.98-1.219-3.847-2.65-5.326a9.97 9.97 0 0 1-2.86-7.066c0-1.915.373-3.756.95-5.557a6.5 6.5 0 0 1 3.79-4.49c.503-.232 1.02-.41 1.545-.533.44-.1.894-.14 1.35-.12z"></path>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="eraser" title="Eraser">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                                <line x1="18" y1="9" x2="12" y2="15"></line>
                                <line x1="12" y1="9" x2="6" y2="15"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="sidebar-title">Shapes</h3>
                    <div class="tool-palette">
                        <button class="tool-btn" data-tool="line" title="Line">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="rectangle" title="Rectangle">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="circle" title="Circle">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <circle cx="12" cy="12" r="10"></circle>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="arrow" title="Arrow">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="sidebar-title">Drafting Tools</h3>
                    <div class="tool-palette">
                        <button class="tool-btn" data-tool="ruler" title="Ruler">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21.3 8.7l-5.6-5.6c-.4-.4-1-.4-1.4 0L2.7 15.3c-.4.4-.4 1 0 1.4l5.6 5.6c.4.4 1 .4 1.4 0L21.3 10.1c.4-.4.4-1 0-1.4z"></path>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="protractor" title="Protractor">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M12 2v20M2 12h20"></path>
                                <circle cx="12" cy="12" r="10"></circle>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="text" title="Text">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <polyline points="4 7 4 4 20 4 20 7"></polyline>
                                <line x1="9" y1="20" x2="15" y2="20"></line>
                                <line x1="12" y1="4" x2="12" y2="20"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="sidebar-title">Properties</h3>
                    <div class="property-group">
                        <label>Line Width</label>
                        <input type="range" id="line-width" min="1" max="50" value="3">
                        <span id="line-width-value">3px</span>
                    </div>
                    <div class="property-group">
                        <label>Opacity</label>
                        <input type="range" id="opacity" min="0" max="100" value="100">
                        <span id="opacity-value">100%</span>
                    </div>
                    <div class="property-group">
                        <label>Pressure Sensitivity</label>
                        <input type="checkbox" id="pressure-sensitive" checked>
                    </div>
                </div>
            </aside>

            <!-- Canvas Area -->
            <main class="canvas-container">
                <div class="canvas-wrapper">
                    <canvas id="drawing-canvas"></canvas>
                    <canvas id="grid-canvas"></canvas>
                    <canvas id="ruler-canvas"></canvas>
                </div>
                <div class="canvas-info">
                    <span id="coordinates">X: 0, Y: 0</span>
                    <span id="zoom-level">Zoom: 100%</span>
                </div>
            </main>

            <!-- Right Sidebar - Layers & Templates -->
            <aside class="sidebar right-sidebar" id="right-sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-header">
                        <h3 class="sidebar-title">Layers</h3>
                        <button class="icon-btn" id="add-layer-btn" title="Add Layer">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="layers-list" id="layers-list">
                        <div class="layer-item active" data-layer="0">
                            <span class="layer-name">Layer 1</span>
                            <div class="layer-controls">
                                <button class="layer-btn" title="Toggle Visibility">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                                <button class="layer-btn" title="Delete">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="sidebar-title">Templates</h3>
                    <div class="templates-grid">
                        <button class="template-btn" data-template="grid">
                            <div class="template-preview grid-preview"></div>
                            <span>Grid</span>
                        </button>
                        <button class="template-btn" data-template="ruled">
                            <div class="template-preview ruled-preview"></div>
                            <span>Ruled</span>
                        </button>
                        <button class="template-btn" data-template="isometric">
                            <div class="template-preview isometric-preview"></div>
                            <span>Isometric</span>
                        </button>
                        <button class="template-btn" data-template="dot">
                            <div class="template-preview dot-preview"></div>
                            <span>Dot Grid</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="sidebar-title">Export</h3>
                    <div class="export-options">
                        <button class="export-btn" id="export-png">PNG</button>
                        <button class="export-btn" id="export-pdf">PDF</button>
                        <button class="export-btn" id="export-svg">SVG</button>
                        <button class="export-btn" id="export-json">JSON</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- File Menu Dropdown -->
    <div class="dropdown-menu" id="file-menu">
        <button class="dropdown-item" id="new-file">New</button>
        <button class="dropdown-item" id="open-file">Open</button>
        <button class="dropdown-item" id="save-file">Save</button>
        <button class="dropdown-item" id="export-file">Export</button>
    </div>

    <script src="js/drawing-engine.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/drafting-tools.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
